<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bike Repair & Servicing Portal</title>
    <style>
        /* CSS কালার স্কিম এবং স্টাইল */
        :root {
            --bg-color: #1C354C; 
            --accent-orange: #e67e22; 
            --text-light: #ffffff; 
            --spinner-base: rgba(255, 255, 255, 0.15); 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* লোডার স্ক্রিন */
        #loader-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        /* গোলাকার এবং পালস অ্যানিমেটেড লোগো */
        .logo-container {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            background-image: url('Ghutu.png'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff; 
            border-radius: 50%; 
            border: 4px solid var(--accent-orange); 
            animation: pulseLogo 2s infinite ease-in-out; 
            
            /* Hardware Acceleration (বাগ ফিক্স) */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -moz-backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        @keyframes pulseLogo {
            0% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); 
            }
            50% { 
                transform: scale(1.08); 
                box-shadow: 0 0 25px 15px rgba(230, 126, 34, 0); 
            }
            100% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); 
            }
        }

        /* স্পিনার এবং বাইক আইকনের কন্টেইনার */
        .spinner-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ঘোরানো স্পিনার */
        .bike-spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--spinner-base); 
            border-top: 5px solid var(--accent-orange); 
            animation: spin 1s linear infinite;
        }

        /* স্পিনারের ভেতরের বাইক আইকন */
        .bike-icon {
            position: absolute;
            z-index: 10;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 25px;
            font-size: 18px;
            color: var(--text-light); 
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
            font-weight: 500;
        }

        /* Google Apps Script Iframe */
        #portal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; 
        }
    </style>
</head>
<body>

    <!-- লোডার স্ক্রিন -->
    <div id="loader-screen">
        <div class="logo-container"></div>
        
        <!-- নতুন প্রোগ্রেস বার (স্পিনারের মাঝে বাইক) -->
        <div class="spinner-wrapper">
            <div class="bike-spinner"></div>
            <!-- বাইকের SVG আইকন -->
            <div class="bike-icon">
                <svg viewBox="0 0 640 512" width="30" height="30">
                    <path fill="#e67e22" d="M280 32C280 14.3 294.3 0 312 0L336 0c44.2 0 80 35.8 80 80l0 16 32 0c53 0 96 43 96 96l0 27.4c0 3.2-1.3 6.2-3.6 8.4l-42 42c-2.3 2.3-5.3 3.6-8.4 3.6l-50 0c-35.3 0-64-28.7-64-64c0-11.5 3-22.3 8.3-31.5l-63.5-31.8C314 140.6 304 153.2 304 168l0 152c0 23.9-15.6 44.2-37.4 51.5L256 375l0 137c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32l0-160c0-14.9 10.3-27.7 24.7-31.2l61.5-14.9C251.7 296 256 284.6 256 272l0-104c0-26.5 21.5-48 48-48l16 0 0-40c0-17.7-14.3-32-32-32l-8 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l8 0zM128 384c-35.3 0-64 28.7-64 64s28.7 64 64 64s64-28.7 64-64s-28.7-64-64-64zM0 448c0 70.7 57.3 128 128 128s128-57.3 128-128s-57.3-128-128-128S0 377.3 0 448zM512 384c-35.3 0-64 28.7-64 64s28.7 64 64 64s64-28.7 64-64s-28.7-64-64-64zM384 448c0 70.7 57.3 128 128 128s128-57.3 128-128s-57.3-128-128-128s-128 57.3-128 128z"/>
                </svg>
            </div>
        </div>

        <div class="loading-text">
            অনুগ্রহ করে অপেক্ষা করুন... <br>
            Bike Repair & Servicing পোর্টাল লোড হচ্ছে...
        </div>
    </div>

    <!-- আইফ্রেম যা Apps Script লোড করবে -->
    <iframe id="portal-iframe" 
            src="https://script.google.com/macros/s/AKfycbwkPpkYWMtSfd73mz7Ngs_FW1AY-2h4eth6ZEu1anDOny7A0jE8mrGTguGdXSgr9nld/exec" 
            onload="portalLoaded()">
    </iframe>

    <script>
        function portalLoaded() {
            var loaderScreen = document.getElementById('loader-screen');
            var portalIframe = document.getElementById('portal-iframe');

            // লোডার স্ক্রিন ফেইড আউট করুন
            loaderScreen.style.opacity = '0';
            
            setTimeout(function() {
                loaderScreen.style.display = 'none';
                portalIframe.style.display = 'block';
            }, 500);
        }
    </script>
</body>
</html>
