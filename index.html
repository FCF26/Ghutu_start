<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bike Repair & Servicing Portal</title>
    <style>
        /* CSS কালার স্কিম এবং স্টাইল */
        :root {
            --bg-color: #1C354C; /* আপনার দেওয়া গাঢ় নীল ব্যাকগ্রাউন্ড */
            --accent-orange: #e67e22; /* লোগোর তামাটে/কমলা থিমের সাথে ম্যাচ করা রঙ */
            --text-light: #ffffff; /* সাদা টেক্সট */
            --spinner-base: rgba(255, 255, 255, 0.15); /* স্পিনারের হালকা বর্ডার */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* লোডার স্ক্রিন */
        #loader-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        /* গোলাকার এবং পালস অ্যানিমেটেড লোগো */
        .logo-container {
            width: 150px;
            height: 150px;
            margin-bottom: 25px;
            /* আপনার দেওয়া লোগো ফাইল */
            background-image: url('Ghutu.png'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff; /* লোগোর ব্যাকগ্রাউন্ড সাদা */
            border-radius: 50%; 
            border: 4px solid var(--accent-orange); 
            animation: pulseLogo 2s infinite ease-in-out; 
            
            /* Square box shadow বাগ ফিক্স করার কোড (Hardware Acceleration) */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -moz-backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        /* লোগোর পালস অ্যানিমেশন (কমলা আভা ছড়ানো) */
        @keyframes pulseLogo {
            0% { 
                transform: scale(1); 
                /* 230, 126, 34 হলো #e67e22 (কমলা) রঙের RGB কোড */
                box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); 
            }
            50% { 
                transform: scale(1.08); 
                box-shadow: 0 0 25px 15px rgba(230, 126, 34, 0); 
            }
            100% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); 
            }
        }

        /* CSS মেকানিক্যাল স্পিনার */
        .bike-spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid var(--spinner-base); 
            border-top: 5px solid var(--accent-orange); 
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 25px;
            font-size: 18px;
            color: var(--text-light); 
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
            font-weight: 500;
        }

        /* Google Apps Script Iframe */
        #portal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; 
        }
    </style>
</head>
<body>

    <!-- লোডার স্ক্রিন -->
    <div id="loader-screen">
        <div class="logo-container"></div>
        <div class="bike-spinner"></div>
        <div class="loading-text">
            অনুগ্রহ করে অপেক্ষা করুন... <br>
            Bike Repair & Servicing পোর্টাল লোড হচ্ছে...
        </div>
    </div>

    <!-- আইফ্রেম যা Apps Script লোড করবে -->
    <iframe id="portal-iframe" 
            src="https://script.google.com/macros/s/AKfycbwkPpkYWMtSfd73mz7Ngs_FW1AY-2h4eth6ZEu1anDOny7A0jE8mrGTguGdXSgr9nld/exec" 
            onload="portalLoaded()">
    </iframe>

    <script>
        function portalLoaded() {
            var loaderScreen = document.getElementById('loader-screen');
            var portalIframe = document.getElementById('portal-iframe');

            // লোডার স্ক্রিন ফেইড আউট করুন
            loaderScreen.style.opacity = '0';
            
            setTimeout(function() {
                loaderScreen.style.display = 'none';
                portalIframe.style.display = 'block';
            }, 500);
        }
    </script>
</body>
</html>
